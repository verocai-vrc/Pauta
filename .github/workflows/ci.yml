name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TAURI_LIBS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LIBS

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: UI type check
        run: pnpm check
      - name: UI unit tests
        run: pnpm test
      - name: UI build (also needed by tauri::generate_context!)
        run: pnpm build

      - name: Browser checks (autosave regression, every screen with axe, WCAG 2.2 AA)
        run: |
          pnpm exec playwright-core install --with-deps chromium
          pnpm test:browser

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    # The real app driven through tauri-driver. WebKitWebDriver is not installable on the
    # development box, so this job is the only place the suite runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries and WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LIBS webkit2gtk-driver xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-driver --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not plain `cargo build`: that makes a dev binary, which loads devUrl (no server here)
      # instead of the embedded UI. --debug keeps debug_assertions, needed for PAUTA_NOW.
      - run: pnpm tauri build --debug --no-bundle

      - name: End-to-end
        run: xvfb-run -a dbus-run-session -- pnpm test:e2e
