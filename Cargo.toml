[workspace]
resolver = "2"
members = ["crates/pauta-core", "crates/pauta-mcp", "crates/pauta-cli", "crates/pauta-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Arthur"]
rust-version = "1.88"

[workspace.dependencies]
pauta-core = { path = "crates/pauta-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
ulid = "1"
blake3 = "1"
tempfile = "3"
